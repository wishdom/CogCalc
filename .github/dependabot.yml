version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # These crates are released together and should stay compatible.
      egui:
        patterns: ["eframe", "egui*"]
      rust-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
